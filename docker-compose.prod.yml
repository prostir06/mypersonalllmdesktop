# Production overrides for docker-compose.yml
#
# Usage (from repo root, with a real .env — never commit secrets):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires: JWT_SECRET, DB_PASSWORD (non-placeholder). OPENAI_API_KEY if using OpenAI.
# Postgres is not published to the host. Backend uses image dist/ only (no bind-mount).

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_DB: ${DB_NAME:-llm_assistant}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set for production}

  backend:
    volumes: !reset []
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-llm_assistant}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set for production}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-llm_assistant}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set for production}
      JWT_ACCESS_EXPIRE: ${JWT_ACCESS_EXPIRE:-15m}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-30d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set for production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://host.docker.internal:11434/v1/chat/completions}
      OLLAMA_URL_ALLOWLIST: ${OLLAMA_URL_ALLOWLIST:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    restart: unless-stopped

  frontend:
    environment: !reset {}
    restart: unless-stopped
