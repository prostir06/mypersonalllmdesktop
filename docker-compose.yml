# Default stack = local/dev (bind-mount + published Postgres).
# Production (fail-closed secrets, no DB host port, no bind-mount):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: llm-assistant-db
    environment:
      POSTGRES_DB: ${DB_NAME:-llm_assistant}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5
    networks:
      - db-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm-assistant-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-llm_assistant}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-llm_assistant}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_ACCESS_EXPIRE: ${JWT_ACCESS_EXPIRE:-15m}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-30d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://host.docker.internal:11434/v1/chat/completions}
      OLLAMA_URL_ALLOWLIST: ${OLLAMA_URL_ALLOWLIST:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Dev only: live source. Production override resets this so image dist/ is used.
      # Anonymous /app/node_modules is cached separately — after adding npm deps:
      #   docker compose up -d --build --force-recreate --renew-anon-volumes backend
      - ./backend:/app
      - /app/node_modules
      # Writable dirs for non-root appuser (bind-mount ./backend hides image paths).
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    mem_limit: 1g
    cpus: 1.0
    networks:
      - db-network
      - llm-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: llm-assistant-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
    networks:
      - llm-network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_logs:
  backend_uploads:

networks:
  db-network:
    driver: bridge
    internal: true
  llm-network:
    driver: bridge
