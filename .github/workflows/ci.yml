# ============================================================
# GitHub Actions CI
# On push/PR: backend tests > frontend build > desktop smoke > docker build
# ============================================================

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: llm_assistant_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: llm_assistant_test
      DB_USER: postgres
      DB_PASSWORD: testpassword
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/llm_assistant_test
      JWT_SECRET: test_jwt_secret_for_ci_at_least_32_chars
      JWT_ACCESS_EXPIRE: 15m
      JWT_REFRESH_EXPIRE: 30d
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      OPENAI_API_KEY: sk-test-ci-placeholder

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Check compose hardening
        run: node scripts/check-compose-hardening.mjs

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend

      - name: Explicit any ratchet
        run: node scripts/any-ratchet.mjs backend

      - name: Generate Prisma client
        run: npx prisma generate --config prisma/prisma.config.ts
        working-directory: backend

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy --config prisma/prisma.config.ts
        working-directory: backend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: backend

      - name: Security audit
        run: npm run audit:ci
        working-directory: backend

      - name: Run backend tests with coverage
        run: npm run test:coverage
        working-directory: backend

      - name: pgvector integration tests
        run: npm run test:integration
        working-directory: backend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 1

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Explicit any ratchet
        run: node scripts/any-ratchet.mjs frontend

      - name: Unit tests
        run: npm test
        working-directory: frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true

      - name: Production build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: /api

      - name: Check frontend bundle budget
        run: npm run check:bundle --prefix frontend

  test-desktop:
    name: Desktop Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend UI (Electron extraResources)
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: /api

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Typecheck and unit tests
        run: npm test
        working-directory: desktop

      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: desktop
        continue-on-error: true

      - name: Electron pack smoke (--dir, no GUI)
        run: npm run pack:ci
        working-directory: desktop

      - name: Assert pack output exists
        run: test -d release && ls -la release
        working-directory: desktop

  build-desktop-win:
    name: Desktop Windows Artifact
    runs-on: windows-latest
    needs: [build-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend UI (Electron extraResources)
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: /api

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Desktop unit tests
        run: npm test
        working-directory: desktop

      - name: Build Windows installer
        run: npm run dist
        working-directory: desktop

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: desktop-windows
          path: desktop/release/
          if-no-files-found: ignore
          retention-days: 3

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, test-desktop]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: llm-assistant-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: llm-assistant-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
