# Shared response headers. Included from every location so add_header does not
# drop a parent header. $security_csp and $hsts_header are set by nginx.conf.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self)" always;
add_header Content-Security-Policy $security_csp always;
add_header Strict-Transport-Security $hsts_header always;
