# $hsts_header is non-empty only when the request is HTTPS or the TLS proxy
# forwarded it as HTTPS. Plain HTTP leaves the value empty.
map "$scheme|$http_x_forwarded_proto" $hsts_header {
    default "";
    "~*^https\|" "max-age=31536000; includeSubDomains";
    "~\|https$" "max-age=31536000; includeSubDomains";
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml font/woff2;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        set $security_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.gravatar.com; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # Isolated opaque-origin sandbox frame for interactive HTML/SVG artifacts
    location = /artifact-sandbox.html {
        set $security_csp "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'";
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # Proxy API to backend service (Docker Compose network)
    location /api/ {
        set $security_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.gravatar.com; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        set $security_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.gravatar.com; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
